                --p1-red: #ff0000;
                --p2-orange: #ff8c00;
                --p3-cyan: #00ffff;
                --p4-purple: #9d50bb;
                --section-yellow: #ffff00;
                --ch-green: #39ff14;
                --topic-white: #ffffff;
                --bg-dark: #050505;

                transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
                -webkit-tap-highlight-color: transparent;
            }

            body {
                background: var(--bg-dark);
                color: var(--topic-white);
                font-family: 'Rajdhani', sans-serif;
                margin: 0;
                display: flex;
                flex-direction: column;
                height: 100vh;
                overflow: hidden;
            }

            #login-screen {
                position: fixed;
                inset: 0;
                z-index: 1000;
                display: flex;
                justify-content: center;
                align-items: center;
                background: radial-gradient(circle, #1a0000 0%, #000 100%);
            }

            .auth-card {
                background: var(--card-bg);
                padding: 30px;
                border: 1px solid var(--p1-red);
                border-radius: 20px;
                text-align: center;
                width: 90%;
                max-width: 400px;
                box-shadow: 0 0 30px rgba(255, 0, 0, 0.2);
            }

            .logo-box {
                position: relative;
                width: 100px;
                height: 100px;
                margin: 0 auto 15px;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .logo-img {
                width: 100%;
                height: 100%;
                object-fit: contain;
                animation: breathing 3s ease-in-out infinite;
            }

            .sidebar-logo-container {
                text-align: center;
                padding-bottom: 10px;
                border-bottom: 1px solid rgba(255,255,255,0.05);
                margin-bottom: 15px;
            }

            .sidebar-logo {
                width: 45px;
                height: 45px;
                border-radius: 50%;
                animation: orbitGlow 4s ease-in-out infinite;
                filter: drop-shadow(0 0 5px var(--p3-cyan));
            }

            #loading-overlay {
                position: fixed;
                inset: 0;
                background: rgba(0,0,0,0.9);
                z-index: 9999;
                display: none;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                backdrop-filter: blur(10px);
            }

            .loader-logo {
                width: 80px;
                height: 80px;
                animation: breathing 1.5s infinite;
            }

            @keyframes breathing {
                0%, 100% { transform: scale(1); filter: drop-shadow(0 0 5px var(--p1-red)); }
                50% { transform: scale(1.05); filter: drop-shadow(0 0 15px var(--p1-red)); }
            }

            @keyframes orbitGlow {
                0%, 100% { filter: drop-shadow(0 0 5px var(--p3-cyan)); border-color: var(--p3-cyan); }
                50% { filter: drop-shadow(0 0 12px var(--ch-green)); border-color: var(--ch-green); }
            }

            .pass-input-wrapper {
                position: relative;
                display: flex;
                align-items: center;
                border-bottom: 2px solid var(--p1-red);
                margin-top: 20px;
            }

            input[type="password"] {
                background: transparent;
                border: none;
                color: var(--p1-red);
                font-family: 'Orbitron';
                font-size: 1.2rem;
                padding: 10px;
                width: 100%;
                text-align: center;
                outline: none;
            }

            .login-arrow {
                background: none;
                border: none;
                color: var(--p1-red);
                font-size: 1.5rem;
                cursor: pointer;
                padding: 0 10px;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: 0.2s;
            }

            .login-arrow:hover { transform: translateX(5px); text-shadow: 0 0 10px var(--p1-red); }

            #main-terminal {
                display: none;
                flex: 1;
                grid-template-columns: 1fr;
                overflow: hidden;
            }

            @media (min-width: 768px) { #main-terminal { grid-template-columns: 280px 1fr; } }

            .sidebar {
                background: #0a0a0c;
                border-right: 1px solid rgba(255,255,255,0.05);
                padding: 20px;
                display: flex;
                flex-direction: column;
                overflow-y: auto;
            }

            @media (max-width: 767px) {
                .sidebar { height: auto; border-right: none; border-bottom: 1px solid #333; padding: 15px; }
                .sidebar-logo-container { display: none; }
                #main-terminal { grid-template-rows: auto 1fr; }
                .nav-container { display: flex; overflow-x: auto; gap: 10px; padding-bottom: 5px; scrollbar-width: none; }
                .nav-link { min-width: 140px; margin-bottom: 0 !important; font-size: 0.7rem !important; }
            }

            .nav-link {
                padding: 12px;
                margin-bottom: 8px;
                border-radius: 8px;
                cursor: pointer;
                font-family: 'Orbitron';
                font-size: 0.8rem;
                border-left: 4px solid transparent;
                opacity: 0.6;
            }

            .nav-link.active { border-left-color: var(--p3-cyan); background: rgba(0, 255, 255, 0.1); opacity: 1; }

            .content { overflow-y: auto; padding: 20px 20px 100px 20px; flex: 1; position: relative; }

            /* Showcase / Feed Styles */
            .showcase-grid {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 20px;
            }

            @media (max-width: 1024px) {
                .showcase-grid { grid-template-columns: 1fr; }
            }

            .agent-col {
                background: rgba(255,255,255,0.02);
                border: 1px solid #333;
                border-radius: 12px;
                padding: 15px;
                display: flex;
                flex-direction: column;
                gap: 15px;
            }

            .agent-col h3 {
                text-align: center;
                color: var(--p3-cyan);
                font-family: 'Orbitron';
                margin: 0 0 10px 0;
                border-bottom: 1px solid #333;
                padding-bottom: 10px;
            }

            .date-card {
                background: #111;
                border: 1px solid #333;
                border-radius: 8px;
                padding: 12px;
                cursor: pointer;
                font-family: 'Orbitron';
                color: #ccc;
                text-align: center;
                font-size: 1rem;
                transition: 0.2s;
            }
            .date-card:hover {
                border-color: var(--p3-cyan);
                color: var(--p3-cyan);
                background: rgba(0, 255, 255, 0.05);
            }

            .post-card {
                background: #0a0a0c;
                border: 1px solid #222;
                border-radius: 8px;
                padding: 15px;
                margin-top: 5px;
                margin-bottom: 15px;
            }

            .post-title {
                font-size: 1.1rem;
                color: #fff;
                margin: 0 0 8px 0;
                font-weight: bold;
                text-transform: uppercase;
            }

            .post-desc {
                font-size: 0.85rem;
                color: #aaa;
                line-height: 1.4;
                margin-bottom: 12px;
            }

            .post-img-container {
                display: flex;
                gap: 10px;
                overflow-x: auto;
                scrollbar-width: thin;
                padding-bottom: 5px;
            }

            .post-img {
                height: 120px;
                border-radius: 5px;
                border: 1px solid #333;
                object-fit: cover;
                cursor: pointer;
            }

            .upload-btn-main {
                width: 100%;
                padding: 12px;
                background: rgba(0, 255, 255, 0.1);
                color: var(--p3-cyan);
                border: 1px dashed var(--p3-cyan);
                border-radius: 8px;
                font-family: 'Orbitron';
                cursor: pointer;
                font-weight: bold;
                font-size: 0.9rem;
            }
            
            .upload-btn-main:hover { background: var(--p3-cyan); color: #000; }

            /* Modal Styles */
            .modal-overlay {
                position: fixed;
                inset: 0;
                background: rgba(0,0,0,0.85);
                z-index: 2000;
                display: none;
                justify-content: center;
                align-items: center;
                backdrop-filter: blur(5px);
            }

            .modal-content {
                background: var(--card-bg);
                padding: 25px;
                border-radius: 12px;
                border: 1px solid var(--p3-cyan);
                width: 90%;
                max-width: 450px;
                display: flex;
                flex-direction: column;
                gap: 15px;
                box-shadow: 0 0 30px rgba(0, 255, 255, 0.1);
            }

            .modal-content input, .modal-content textarea {
                background: #0a0a0c;
                border: 1px solid #333;
                color: #fff;
                padding: 12px;
                font-family: 'Rajdhani';
                border-radius: 6px;
                outline: none;
                font-size: 1rem;
            }

            .modal-content input:focus, .modal-content textarea:focus { border-color: var(--p3-cyan); }

            .modal-actions { display: flex; gap: 15px; margin-top: 10px; }
            .modal-actions button {
                flex: 1; padding: 12px; border: none; border-radius: 6px; font-family: 'Orbitron'; cursor: pointer; font-weight: bold; font-size: 0.9rem;
            }

            .btn-cancel { background: #222; color: #aaa; border: 1px solid #444 !important; }
            .btn-publish { background: var(--p3-cyan); color: #000; }

            /* Shared Styles */
            .chart-container { background: rgba(255,255,255,0.02); border: 1px solid #222; border-radius: 15px; padding: 20px; margin-bottom: 30px; position: relative; height: 250px; display: flex; align-items: flex-end; justify-content: space-around; }
            .y-axis { position: absolute; left: 10px; height: 75%; border-left: 1px solid #444; display: flex; flex-direction: column; justify-content: space-between; font-size: 0.6rem; color: #666; padding-left: 5px; }
            .bar-wrapper { display: flex; flex-direction: column; align-items: center; width: 25%; position: relative; z-index: 5; }

            .pie-val { position: relative; z-index: 3; font-family: 'Orbitron'; font-size: 0.8rem; color: #fff; }

            .rank-card { background: #111; padding: 15px; border-radius: 12px; margin-bottom: 12px; cursor: pointer; border: 1px solid #222; }

            .ch-card { background: rgba(255,255,255,0.02); border: 1px solid var(--ch-green); margin-bottom: 15px; border-radius: 10px; overflow: hidden; }
            .ch-head { padding: 12px 15px; background: rgba(57, 255, 20, 0.05); color: var(--ch-green); font-family: 'Orbitron'; font-size: 0.85rem; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }

            .is-subtopic { padding-left: 35px; font-size: 0.8rem; color: #ccc; border-bottom: 1px dashed #222; }

            .footer { background: rgba(0, 0, 0, 0.95); border-top: 1px solid rgba(255, 255, 255, 0.1); padding: 15px 10px; text-align: center; font-family: 'Orbitron', sans-serif !important; font-size: 0.65rem; color: rgba(255, 255, 255, 0.5); width: 100%; flex-shrink: 0; position: relative; z-index: 10; }
            .footer span { color: var(--p3-cyan); text-shadow: 0 0 5px var(--p3-cyan); }
            .node-card { background: rgba(255,255,255,0.02); border: 1px solid #222; padding: 15px; border-radius: 10px; margin-bottom: 10px; position: relative; overflow: hidden; }
            .node-status { float: right; font-family: 'Orbitron'; font-size: 0.6rem; padding: 2px 8px; border-radius: 4px; }
            .lock-container { display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(255, 0, 0, 0.05); border: 1px dashed var(--p1-red); border-radius: 15px; padding: 40px 20px; text-align: center; margin-bottom: 20px; }
        </style>
    </head>

            async function prepImageForDrive(file) {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            const MAX_WIDTH = 800; 
                            let scale = 1;
                            if (img.width > MAX_WIDTH) scale = MAX_WIDTH / img.width;
                            canvas.width = img.width * scale;
                            canvas.height = img.height * scale;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                            const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
                            resolve({
                                data: dataUrl.split(',')[1],
                                type: 'image/jpeg'
                            }); 
                        };
                        img.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                });
            }

            document.getElementById('post-files').addEventListener('change', async (e) => {
                showLoading();
                const files = Array.from(e.target.files);
                pendingImages = await Promise.all(files.map(file => prepImageForDrive(file)));
                hideLoading();
            });

            async function publishPost() {
                const date = document.getElementById('post-date').value;
                const title = document.getElementById('post-title').value;
                const desc = document.getElementById('post-desc').value;
                
                if(!date || !title) return alert("DATE AND TITLE REQUIRED.");
                showLoading();
                
                let imageUrls = [];
                
                if(pendingImages.length > 0) {
                    try {
                        const response = await fetch(DRIVE_SCRIPT_URL, {
                            method: 'POST',

                            body: JSON.stringify({
                                agent: activeAgent,
                                action: "FEED_UPLOAD",
                                title: title,
                                files: pendingImages
                            })
                        });
                        const resData = await response.json();
                        if (resData.urls) {
                            imageUrls = resData.urls;
                        }

                        alert("FAILED TO UPLOAD TO GDRIVE.");
                        console.error(e);
                        hideLoading();
                        return;
                    }
                }
                
                if (!db[activeAgent].posts) db[activeAgent].posts = [];
                
                db[activeAgent].posts.push({ date, title, desc, images: imageUrls });
                
                await fetch(`${API_URL}/agent_name/${activeAgent}`, {
                    method: 'PATCH', headers: { 'Content-Type': 'application/json' },

            function getStudyDay() {

            function updateCountdown() {
                const el = document.getElementById('reset-timer'); if (!el) return;

                if (now < launchDate) {
                    const diff = launchDate - now, d = Math.floor(diff / 86400000), h = Math.floor((diff % 86400000) / 3600000), m = Math.floor((diff % 3600000) / 60000), s = Math.floor((diff % 60000) / 1000);
                    el.innerText = `OPENING IN: ${d}D ${h}H ${m}M ${s}S`; return;
                }
                let target = new Date(); target.setHours(4, 0, 0, 0); if (now.getHours() >= 4) target.setDate(target.getDate() + 1);
                const diff = target - now, h = Math.floor(diff / 3600000), m = Math.floor((diff % 3600000) / 60000), s = Math.floor((diff % 60000) / 1000);
                el.innerText = `RESET IN: ${h}H ${m}M ${s}S`;
            }

            function getChProgress(name, pk, chName) {

                SYLLABUS[pk].sections.forEach(s => s.chapters.filter(c => c.name === chName).forEach(c => c.topics.forEach(tp => {

                })));
                return Math.round((d / t) * 100) || 0;
            }
